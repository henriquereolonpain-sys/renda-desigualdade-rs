const RAZAO_MIN = 1.209, RAZAO_MAX = 1.884;

function corPorRazao(razao) {
    const t = Math.max(0, Math.min(1, (razao - RAZAO_MIN) / (RAZAO_MAX - RAZAO_MIN)));
    const escala = [
        [254, 240, 138],
        [251, 146, 60],
        [220, 38, 38],
        [127, 29, 29],
    ];
    const pos = t * (escala.length - 1);
    const i = Math.min(Math.floor(pos), escala.length - 2);
    const f = pos - i;
    const c = escala[i].map((v, k) => Math.round(v + (escala[i + 1][k] - v) * f));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function formatBRL(v) {
    return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2 });
}

const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([-29.9, -53.3], 7);

// Sem tile de base (sem rios, estradas ou rótulos) — só os limites dos municípios,
// desenhados diretamente sobre o fundo escuro da página.

// --- Contorno do RS em destaque ---
fetch('data/rs_estado.geojson')
    .then(r => r.json())
    .then(geo => {
        L.geoJSON(geo, {
            style: { fill: false, color: '#38bdf8', weight: 2.5, opacity: 0.9 },
            interactive: false,
        }).addTo(map);
    })
    .catch(() => {});

function style(feature) {
    const dado = CIDADES[feature.properties.codarea];
    if (dado) {
        return { fillColor: corPorRazao(dado.razao), weight: 1.4, color: '#f8fafc', fillOpacity: 0.9 };
    }
    return { fillColor: '#1e293b', weight: 0.3, color: '#334155', fillOpacity: 0.35 };
}

function tooltipHtml(dado) {
    let rows = `
        <div class="tip-row"><span>População (2026)</span><b>${dado.populacao.toLocaleString('pt-BR')}</b></div>`;
    if (dado.salario_sm) {
        rows += `<div class="tip-row"><span>Salário médio</span><b>${dado.salario_sm.toFixed(1)} SM</b></div>`;
    }
    rows += `
        <div class="tip-row"><span>PIB per capita</span><b>${formatBRL(dado.pib)}</b></div>
        <div class="tip-row"><span>Renda média (2022)</span><b>${formatBRL(dado.renda_media)}</b></div>
        <div class="tip-row"><span>Renda mediana (2022)</span><b>${formatBRL(dado.renda_mediana)}</b></div>
        <div class="tip-row"><span>Razão média/mediana</span><b>${dado.razao.toFixed(2)}</b></div>`;
    if (dado.gini) {
        rows += `<div class="tip-row"><span>Gini (2010)</span><b>${dado.gini.toFixed(2)}</b></div>`;
    }
    return `<div class="tip-box"><div class="tip-title">${dado.nome}</div>${rows}<div class="tip-hint">github.com/henriquereolonpain-sys/renda-desigualdade-rs</div></div>`;
}

function onEachFeature(feature, layer) {
    const dado = CIDADES[feature.properties.codarea];
    if (!dado) return;
    layer.bindTooltip(tooltipHtml(dado), {
        className: 'cidade-tooltip',
        sticky: true,
        direction: 'top',
        opacity: 1,
    });
    layer.on('mouseover', () => layer.setStyle({ weight: 3, color: '#38bdf8' }));
    layer.on('mouseout', () => layer.setStyle({ weight: 1.4, color: '#f8fafc' }));
}

fetch('data/rs_municipios.geojson')
    .then(r => r.json())
    .then(geo => {
        L.geoJSON(geo, { style, onEachFeature }).addTo(map);
    })
    .catch(err => {
        document.getElementById('map').innerHTML =
            '<p style="color:#f87171;padding:2rem;">Não foi possível carregar rs_municipios.geojson. ' + err + '</p>';
    });

    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
        <b>Razão renda média / mediana (2022)</b>
        <div class="legend-scale">
            <span>1,21</span>
            <span class="legend-swatch" style="background:${corPorRazao(1.21)}"></span>
            <span class="legend-swatch" style="background:${corPorRazao(1.43)}"></span>
            <span class="legend-swatch" style="background:${corPorRazao(1.66)}"></span>
            <span class="legend-swatch" style="background:${corPorRazao(1.88)}"></span>
            <span>1,88</span>
        </div>
        <div style="margin-top:4px;opacity:.75">mais claro = renda mais distribuída · 54 cidades cobertas (50 maiores do RS + 4 do Planalto Médio)</div>`;
    return div;
};
legend.addTo(map);
